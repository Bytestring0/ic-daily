# ============================================================
# 微电子 / 集成电路 信息源
# ============================================================
# 字段说明：
#   name      显示名称
#   url       RSS / Atom 地址
#   lang      zh | en
#   category  用于卡片配色与分组，可选：
#             foundry 晶圆代工 | equipment 设备 | eda EDA
#             memory 存储     | design 设计   | material 材料封测
#             policy 政策     | research 研究 | market 市场
#   weight    权重 (0-10)，影响排序打分
#   enabled   是否启用
# ------------------------------------------------------------
# 注意：部分站点会改 RSS 路径或封禁 UA。抓取失败不会中
#      断整条流水线，只会在日志里标 [SKIP]，其余源照常。
# ============================================================

sources:
  # ---------- 英文：行业媒体 ----------
  - name: EE Times
    url: https://www.eetimes.com/feed/
    lang: en
    category: market
    weight: 7
    enabled: true

  - name: SemiEngineering
    url: https://semiengineering.com/feed/
    lang: en
    category: research
    weight: 8
    enabled: true

