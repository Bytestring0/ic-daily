# ============================================================
# 可选：浏览器采集（针对 EETOP 这类 JS 验证站点）
# ============================================================
# 若一定要接 EETOP，需要改造成两段式流水线：
#   1. Playwright 打开 https://www.eetop.cn/ ，执行 JS 挑战、拿到 cookie
#   2. 用该 cookie 请求列表页，解析 .list li a 抽标题与链接
# 代价：CI 里要装 ~120MB Chromium，且验证策略变动就会挂，
#       失败时整条链路受影响。建议只在本地跑，或单独做成旁路脚本。
# ============================================================
