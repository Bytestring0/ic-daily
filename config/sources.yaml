# ============================================================
# 微电子 / 集成电路 信息源
# ============================================================
# 字段说明：
#   name      显示名称
#   url       RSS / Atom 地址
#   lang      zh | en
#   category  用于卡片配色与分组，可选：
#             foundry 晶圆代工 | equipment 设备 | eda EDA
#             memory 存储     | design 设计   | material 材料封测
#             policy 政策     | research 研究 | market 市场
#   weight    权重 (0-10)，影响排序打分
#   enabled   是否启用
# ------------------------------------------------------------
# 已验证：以下所有 url 均实测返回有效 feed。
# 抓取失败不会中断流水线，只会在日志里标 [SKIP]。
#
# ⚠ 关于 EETOP（eetop.cn）：
#   该站启用了 JS 人机验证（cloudflare 类挑战），并**没有公开 RSS 出口**。
#   所有 /feed、/rss.xml、/api/rss 均返回 403 或伪装成 200 的错误页。
#   纯 HTTP 采集无法获取，需 Playwright 渲染 + 破验证，不适合放进每日无人值守流水线。
#   若你确实需要，见 config/sources.yaml 底部注释的「浏览器采集」方案。
# ============================================================

sources:
  - name: TechPowerUp
    url: https://www.techpowerup.com/rss/news
    lang: en
    category: design
    weight: 6
    enabled: true

  # 公众号经第三方 RSS 转发，保留微信原文链接；可用自建服务替换 url。
  # 此公共转发站在部分网络不可达，失败会记录，不冒充采集成功。
  - name: EETOP 微信公众号
    url: https://decemberpei.cyou/rssbox/wechat-eetop.xml
